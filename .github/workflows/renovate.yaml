name: Renovate

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [renovate]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          # Without this the container starts with no target repo and logs
          # "No repositories found" (verified in run 38943530687).
          RENOVATE_REPOSITORIES: ${{ github.repository }}
