name: Lint Helm Charts

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  pull_request:
    paths:
      - 'charts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/helm@v3
        with:
          version: 'v3.16.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chart-testing
        run: |
          pip install chart-testing

      - name: Lint charts
        run: |
          ct lint --target-branch=main --charts=charts
