name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Pages landing page
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          git worktree add /tmp/ghpages FETCH_HEAD
          python3 .github/scripts/render_pages_index.py \
            --index /tmp/ghpages/index.yaml \
            --output /tmp/ghpages/index.html
          cd /tmp/ghpages
          # index.html wins over the legacy Jekyll-rendered README at /
          git add index.html
          git rm --cached README.md --quiet 2>/dev/null || true
          rm -f README.md
          if git diff --cached --quiet; then
            echo "Landing page already up to date."
          else
            git commit -m "Update landing page from index.yaml [skip ci]"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:gh-pages
          fi
