apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchmon.fullname" . }}-secrets
  labels:
    {{- include "patchmon.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.jwtSecret }}
  jwt-secret: {{ .Values.config.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.sessionSecret }}
  session-secret: {{ .Values.config.sessionSecret | b64enc | quote }}
  {{- else }}
  session-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.aiEncryptionKey }}
  ai-encryption-key: {{ .Values.config.aiEncryptionKey | b64enc | quote }}
  {{- else }}
  ai-encryption-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.postgresPassword }}
  postgres-password: {{ .Values.config.postgresPassword | b64enc | quote }}
  {{- else if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.redisPassword }}
  redis-password: {{ .Values.config.redisPassword | b64enc | quote }}
  {{- else if .Values.redis.auth.password }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.auth.username }}
  postgres-username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  {{- else }}
  postgres-username: cGF0Y2htb25fdXNlcg==
  {{- end }}
  {{- if .Values.postgresql.auth.database }}
  postgres-database: {{ .Values.postgresql.auth.database | b64enc | quote }}
  {{- else }}
  postgres-database: cGF0Y2htb25fZGI=
  {{- end }}
