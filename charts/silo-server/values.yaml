# Default values for silo-server
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/silo-server/silo-server
  pullPolicy: IfNotPresent
  # Upstream publishes no versioned releases (latest/nightly/commit-sha only).
  # Pinned to the digest of :latest as of 2026-11-09; the Hermes weekly sweep
  # opens a PR when the digest changes. Set digest (repo@sha256:...) to win.
  digest: ""
  tag: "latest@sha256:68a99cde6e5a093970b8280622ec8f6c3f31f3caeac2c05072316610cd154d19"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

# Pod-level sysctls appended to pod securityContext.sysctls (netns-owned
# safe sysctls on k8s >= 1.32, e.g.):
#   podSysctls:
#     - name: net.ipv4.tcp_wmem
#       value: "4096 131072 67108864"
podSysctls: []

securityContext: {}

# Additional volumes/mounts appended verbatim to the pod (e.g. NFS media
# shares served straight from the NAS, mirroring the jellyfin chart pattern):
#   extraVolumes:
#     - name: video-nfs
#       nfs: { server: fenrir.example, path: /rust/video }
#   extraVolumeMounts:
#     - { name: video-nfs, mountPath: /media/video }
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  ports:
    ui:
      port: 8090
      targetPort: 8090
      protocol: TCP
    jellyfin:
      port: 8096
      targetPort: 8096
      protocol: TCP

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  name: postgresql
  host: ""
  port: 5432
  database: silo
  username: silo
  password: ""
  existingSecret: ""
  existingSecretKey: postgresql-password

# Redis configuration
redis:
  enabled: true
  name: redis
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretKey: redis-password

# Persistence settings
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 100Gi
  # Per-volume overrides. enabled=false renders an emptyDir instead of a PVC
  # (e.g. media served from NFS via extraVolumes, or scratch dirs). size ""
  # inherits persistence.size.
  volumes:
    transcode:
      enabled: true
      size: ""
    plugins:
      enabled: true
      size: ""
    catalogSeeds:
      enabled: true
      size: ""
    media:
      enabled: true
      size: ""
  # Subpath for each volume
  transcodeSubPath: transcode
  pluginsSubPath: plugins
  catalogSeedsSubPath: catalog-seeds
  mediaSubPath: media

# Silo Server environment variables
config:
  # General settings
  silo_url: "http://localhost:8090"
  silo_host: "0.0.0.0"
  # The silo binary honours PORT (container env wins over the /config/silo/.env
  # PORT= line, then silo's built-in 8080 default). SILO_LISTEN is
  # upstream-compose parity only; the binary does not read it.
  # The silo binary honours PORT (container env wins over the /config/silo/.env
  # PORT= line, then silo's built-in 8080 default); the chart emits both PORT
  # and SILO_PORT from this value. SILO_LISTEN is upstream-compose parity only.
  silo_port: 8090
  silo_media_port: 8096
  silo_listen: "0.0.0.0:8090"

  # Paths
  silo_transcode_dir: "/tmp/transcode"
  silo_plugins_dir: "/app/plugins"
  silo_catalog_seeds_dir: "/app/catalog-seeds"
  silo_media_dir: "/media"

  # Database (will be overridden by secrets)
  silo_db_host: ""
  silo_db_port: ""
  silo_db_name: ""
  silo_db_user: ""
  silo_db_pass: ""

  # Redis (will be overridden by secrets)
  silo_redis_host: ""
  silo_redis_port: ""
  silo_redis_pass: ""

  # Security
  silo_secret_key: ""
  silo_cors_origins: "*"
  silo_trusted_proxy: ""

  # Hardware transcoding
  silo_hwtranscode_intel: "true"
  silo_hwtranscode_nvidia: "false"
  silo_hwtranscode_arm: "false"
  silo_hwtranscode_vaapi: "/dev/dri/renderD128"

  # Logging
  silo_log_level: "info"

# GPU configuration for hardware transcoding
# Supply an externally-managed Secret (e.g. synced by ExternalSecrets from
# Vault) instead of the chart-rendered one. When set, the chart omits its own
# Secret and the Deployment reads DATABASE_URL and SECRET_KEY from this secret
# via secretKeyRef (UPPERCASE keys) and envFrom. Expected keys:
#   SECRET_KEY, DATABASE_URL, REDIS_URL
secrets:
  existingSecret: ""

gpu:
  enabled: false
  device:
    intel: false
    nvidia: false
    arm: false
