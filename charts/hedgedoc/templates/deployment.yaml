apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hedgedoc.fullname" . }}
  labels:
    {{- include "hedgedoc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hedgedoc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hedgedoc.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hedgedoc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.cnpg.enabled .Values.externalDatabase.enabled }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database at $CMD_DB_HOST:$CMD_DB_PORT..."
              until nc -z "$CMD_DB_HOST" "$CMD_DB_PORT"; do sleep 2; done
              echo "Database reachable."
          env:
            - name: CMD_DB_HOST
              value: {{ include "hedgedoc.dbHost" . | quote }}
            - name: CMD_DB_PORT
              value: {{ include "hedgedoc.dbPort" . | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      volumes:
        - name: uploads
          {{- if .Values.hedgedoc.persistentStorage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hedgedoc.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: hedgedoc
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "hedgedoc.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-secrets" (include "hedgedoc.fullname" .)) }}
                optional: true
          {{- if .Values.cnpg.enabled }}
          env:
            - name: CMD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hedgedoc.cnpg.appSecretName" . }}
                  key: password
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.hedgedoc.port }}
              protocol: TCP
          volumeMounts:
            - mountPath: /hedgedoc/public/uploads
              name: uploads
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
