# ct install fixture: kind has no CNPG operator (Cluster CR would fail
# client-side discovery) and no Postgres — point at external stubs instead.
cnpg:
  enabled: false
externalDatabase:
  enabled: true
  host: postgres
  port: 5432
  database: paperless
  user: paperless
  password: ci-password
# No DB exists in kind: skip the TCP-wait init containers and the HTTP
# probes so the pod initializes and becomes ready (ct install waits).
waitForDb:
  enabled: false
startupProbe:
  enabled: false
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
persistence:
  data:
    enabled: false
  media:
    enabled: false
  consume:
    enabled: false
  export:
    enabled: false
