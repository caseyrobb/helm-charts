# Default values for paperless-ngx
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  pullPolicy: IfNotPresent
  tag: "3.1.3"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  name: postgresql
  host: ""
  port: 5432
  database: paperless
  username: paperless
  password: ""
  existingSecret: ""
  existingSecretKey: postgresql-password

# Redis configuration
redis:
  enabled: true
  name: redis
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretKey: redis-password

# Persistence settings
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  subPath: ""

# Paperless-ngx environment variables
config:
  # General settings
  paperless_url: "http://localhost:8000"
  paperless_lang: "en-US"
  paperless_timezone: "UTC"
  
  # Document settings
  paperless_consume_dir: "/usr/src/paperless/consume"
  paperless_export_dir: "/usr/src/paperless/export"
  
  # Database settings (override if using external DB)
  paperless_dbhost: ""
  paperless_dbport: ""
  paperless_dbname: ""
  paperless_dbuser: ""
  paperless_dbpass: ""
  
  # Redis settings (override if using external Redis)
  paperless_redis: "redis://redis:6379"
  paperless_redisport: ""
  
  # Webserver settings
  paperless_webserver_workers: 2
  
  # Security settings
  paperless_secret_key: ""
  paperless_trusted_proxies: ""
  paperless_allowed_hosts: "*"
  
  # Mail settings
  paperless_mailhost: ""
  paperless_mailport: ""
  paperless_mailuser: ""
  paperless_mailpassword: ""
  paperless_mail_use_tls: "false"
  paperless_mail_use_ssl: "false"
