# ct install fixture: kind has no CNPG operator (Cluster CR would fail
# client-side discovery) and no Postgres — point at external stubs instead.
cnpg:
  enabled: false
externalDatabase:
  enabled: true
  host: postgres
  port: 5432
  username: hedgedoc
  database: hedgedoc
existingSecret: ci-hedgedoc-secrets
hedgedoc:
  persistentStorage:
    enabled: false
# No DB exists in kind: skip the TCP-wait init container and the HTTP
# probes so the pod initializes and becomes ready (ct install --wait).
waitForDb:
  enabled: false
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
