name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"
  pull_request:
    branches:
      - master
    paths:
      - "charts/**"

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Package charts
        run: |
          shopt -s nullglob
          packaged=0
          for chart_dir in charts/*/; do
            if [[ -f "${chart_dir}Chart.yaml" ]]; then
              echo "Packaging ${chart_dir}"
              helm package "${chart_dir}"
              packaged=$((packaged + 1))
            fi
          done
          if [[ "${packaged}" -eq 0 ]]; then
            echo "No charts found to package" >&2
            exit 1
          fi
          ls -l *.tgz

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true
