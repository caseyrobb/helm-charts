apiVersion: v1
kind: Secret
metadata:
  name: {{ include "silo-server.fullname" . }}-secret
  labels:
    {{- include "silo-server.labels" . | nindent 4 }}
type: Opaque
data:
  # PostgreSQL password
  {{- if .Values.postgresql.existingSecret }}
  # Password is in existing secret, not duplicated here
  {{- else }}
  postgresql-password: {{ .Values.postgresql.password | b64enc | quote }}
  {{- end }}
  
  # Redis password
  {{- if .Values.redis.existingSecret }}
  # Password is in existing secret, not duplicated here
  {{- else }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
  
  # Secret key for Silo Server
  secret-key: {{ (randAlphaNum 50) | b64enc | quote }}
  
  # Database connection string
  database-url: {{ include "silo-server.database.url" . | b64enc | quote }}
  
  # Redis connection string
  redis-url: {{ include "silo-server.redis.url" . | b64enc | quote }}
